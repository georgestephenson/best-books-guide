<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Best Books Guide">
  <title>Best Books Guide</title>
  <rect width="64" height="64" rx="14" fill="#1f5140" />
  <!-- Three spines on a shelf — the same mark the home hero animates. The third
       leans, which keeps the silhouette from reading as a plain bar chart. -->
