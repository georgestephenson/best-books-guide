<!doctype html>
<!--
  Source for apps/web/public/og.png (1200×630) — rendered by ./generate.mjs.
  Colours are the design tokens from apps/web/src/index.css; the shelf of spines
  echoes the home hero. Edit here, re-run the generator, commit the PNG.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --paper: #f1f2ee;
        --ink: #23261f;
        --muted: #5e6358;
        --faint: #656d5b;
        --accent: #1f5140;
        --accent-soft: #2f6b55;
        --line: #d8d9d0;
        --star: #b08a3e;
        /* The site's serif stack, with the Linux-available fallbacks the renderer
           actually resolves to (Charter is the closest match to Iowan/Palatino). */
        --serif:
          'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia,
          'Bitstream Charter', 'Liberation Serif', serif;
        --sans: 'Segoe UI', Roboto, 'Liberation Sans', 'DejaVu Sans', sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--serif);
        position: relative;
        overflow: hidden;
      }
      .rule {
        height: 10px;
        background: linear-gradient(
          90deg,
          var(--accent) 0%,
          var(--accent-soft) 60%,
          var(--star) 100%
        );
      }
      .body {
        padding: 64px 72px 0;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .mark span {
        font-family: var(--sans);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--faint);
      }
      h1 {
        margin-top: 40px;
        font-size: 86px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.04;
      }
      p {
        margin-top: 24px;
        font-size: 33px;
        line-height: 1.35;
        color: var(--muted);
      }
      /* The shelf: spines sitting on a plank across the bottom edge. */
      .shelf {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 46px;
      }
      .spines {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 96px;
      }
      .spines i {
        display: block;
        border-radius: 3px;
        position: relative;
      }
      .spines i::after {
        content: '';
        position: absolute;
        left: 4px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: rgba(255, 255, 255, 0.22);
      }
      .plank {
        height: 9px;
        border-radius: 3px;
        background: var(--muted);
        box-shadow: 0 2px 0 0 rgba(35, 38, 31, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="rule"></div>
    <div class="body">
      <div class="mark">
        <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#1f5140" />
          <rect x="14" y="17" width="12" height="29" rx="2" fill="#f1f2ee" />
          <rect x="28" y="13" width="10" height="33" rx="2" fill="#b08a3e" />
          <rect
            x="41"
            y="18"
            width="11"
            height="28"
            rx="2"
            fill="#f1f2ee"
            opacity="0.85"
            transform="rotate(13 46.5 46)"
          />
          <rect x="10" y="47" width="44" height="5" rx="2.5" fill="#f1f2ee" />
        </svg>
        <span>bestbooks.guide</span>
      </div>
      <h1>The best books,<br />by subject.</h1>
      <p>Curated and ranked by an editor who says why — never by a popularity chart.</p>
    </div>
    <div class="shelf">
      <div class="spines" id="spines"></div>
      <div class="plank"></div>
    </div>
    <script>
      // Deterministic row of spines (same PRNG shape as the home hero) so the image
      // is byte-stable across re-renders.
      const colors = ['#1f5140', '#2f6b55', '#b08a3e', '#23261f', '#5e6358'];
      const pattern = [0, 1, 2, 0, 1, 3, 0, 2, 1, 4, 0, 1, 2, 0, 3, 1];
      let s = 0x9e3779b1 >>> 0;
      const rng = () => ((s = (s * 1664525 + 1013904223) >>> 0), s / 0xffffffff);
      const el = document.getElementById('spines');
      let used = 0;
      const width = 1056; // 1200 - 2 * 72
      for (let i = 0; used < width; i++) {
        const w = 18 + Math.floor(rng() * 26);
        if (used + w > width) break;
        const h = Math.round(96 * (0.45 + rng() * 0.55));
        const i2 = document.createElement('i');
        i2.style.width = w + 'px';
        i2.style.height = h + 'px';
        i2.style.background = colors[pattern[i % pattern.length]];
        el.appendChild(i2);
        used += w + 5;
      }
    </script>
  </body>
</html>
